name: Backend CI/CD to AWS ECR and ECS

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: pilot-backend
  ECS_CLUSTER: pilot-voice-agent-cluster
  CONTAINER_NAME: pilot-backend
  DOCKERFILE_PATH: infra/Dockerfile.backend
  DOCKER_CONTEXT: .

jobs:
  deploy:
    name: Build, Push and Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Select deployment environment
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF_NAME}" == "develop" ]]; then
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_ENV
            echo "STABLE_TAG=dev" >> $GITHUB_ENV
            echo "ECS_SERVICE=pilot-backend-dev-service" >> $GITHUB_ENV
            echo "TASK_DEFINITION=infra/ecs-task-definition-dev.json" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "IMAGE_TAG=prod-${SHORT_SHA}" >> $GITHUB_ENV
            echo "STABLE_TAG=prod" >> $GITHUB_ENV
            echo "ECS_SERVICE=pilot-backend-prod-service" >> $GITHUB_ENV
            echo "TASK_DEFINITION=infra/ecs-task-definition-prod.json" >> $GITHUB_ENV
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        shell: bash
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          STABLE_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$STABLE_TAG"

          docker build \
            -f "$DOCKERFILE_PATH" \
            -t "$IMAGE_URI" \
            -t "$STABLE_IMAGE_URI" \
            "$DOCKER_CONTEXT"

          docker push "$IMAGE_URI"
          docker push "$STABLE_IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
